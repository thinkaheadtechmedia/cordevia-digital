<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cdGradBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cdGradMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cdGradArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="cdBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060911" />
    </radialGradient>
    <filter id="cdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background container tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#cdBg)" stroke="url(#cdGradBorder)" stroke-width="2.5" />

  <!-- Subtle tech accents -->
  <circle cx="16" cy="16" r="1" fill="#06b6d4" opacity="0.3" />
  <circle cx="48" cy="16" r="2.5" fill="#22d3ee" opacity="0.9" />
  <circle cx="16" cy="48" r="1" fill="#06b6d4" opacity="0.3" />
  <circle cx="48" cy="48" r="1" fill="#06b6d4" opacity="0.3" />

  <!-- Monogram C Arc -->
  <path d="M32 15 A 17 17 0 1 0 49 32 H 41.5 A 9.5 9.5 0 1 1 32 22.5 V 15 Z" fill="url(#cdGradMark)" filter="url(#cdGlow)" />

  <!-- Monogram Inner D / Media Arrow -->
  <polygon points="31,24.5 43,32 31,39.5" fill="url(#cdGradArrow)" filter="url(#cdGlow)" />
</svg>
