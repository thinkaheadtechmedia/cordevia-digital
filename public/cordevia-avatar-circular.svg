<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="circleCrop">
      <circle cx="512" cy="512" r="512" />
    </clipPath>

    <radialGradient id="circBg" cx="50%" cy="45%" r="68%">
      <stop offset="0%" stop-color="#0e1829" />
      <stop offset="60%" stop-color="#070c16" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <radialGradient id="circCyanGlow" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="circEmeraldGlow" cx="62%" cy="58%" r="46%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="55%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="circRimGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="circCArc" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="circDPlay" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="40%" stop-color="#2dd4bf" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="circGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="circShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#020617" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>

    <pattern id="circGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.2" fill="#0891b2" fill-opacity="0.18" />
    </pattern>
  </defs>

  <g clip-path="url(#circleCrop)">
    <!-- Base Circular Background -->
    <rect width="1024" height="1024" fill="url(#circBg)" />

    <!-- Ambient Glow Fields -->
    <circle cx="512" cy="512" r="500" fill="url(#circCyanGlow)" />
    <circle cx="580" cy="540" r="440" fill="url(#circEmeraldGlow)" />

    <!-- Subtle Tech Pattern -->
    <rect width="1024" height="1024" fill="url(#circGrid)" />

    <!-- Orbital Calibration Tracks -->
    <circle cx="512" cy="512" r="470" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 12" />
    <circle cx="512" cy="512" r="420" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.2" />

    <!-- Central Outer Ring -->
    <circle cx="512" cy="512" r="372" fill="#090f1c" stroke="url(#circRimGrad)" stroke-width="8" filter="url(#circShadow)" />
    <circle cx="512" cy="512" r="368" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" />

    <!-- Inner Core Monogram -->
    <g filter="url(#circShadow)">
      <!-- Ambient Glow Behind Symbol -->
      <g filter="url(#circGlow)" opacity="0.6">
        <path d="M 512 256 A 256 256 0 1 0 768 512 H 656 A 144 144 0 1 1 512 368 V 256 Z" fill="url(#circCArc)" />
        <polygon points="496,396 680,512 496,628" fill="url(#circDPlay)" />
      </g>

      <!-- Monogram C-Arc -->
      <path d="M 512 256 A 256 256 0 1 0 768 512 H 656 A 144 144 0 1 1 512 368 V 256 Z" fill="url(#circCArc)" />
      <path d="M 512 256 A 256 256 0 1 0 768 512 H 656 A 144 144 0 1 1 512 368 V 256 Z" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-opacity="0.45" />

      <!-- Monogram D-Play Arrow -->
      <polygon points="496,396 680,512 496,628" fill="url(#circDPlay)" />
      <polygon points="496,396 680,512 496,628" fill="none" stroke="#ccfbf1" stroke-width="3" stroke-opacity="0.6" stroke-linejoin="round" />
    </g>

    <!-- Top Right Sparkle / Pulse Node -->
    <circle cx="760" cy="272" r="14" fill="#38bdf8" filter="url(#circGlow)" />
    <circle cx="760" cy="272" r="7" fill="#ffffff" />
    <circle cx="760" cy="272" r="28" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6" stroke-dasharray="4 6" />

    <!-- Bottom Left Node -->
    <circle cx="268" cy="740" r="9" fill="#10b981" opacity="0.8" />
    <circle cx="268" cy="740" r="4.5" fill="#a7f3d0" />
  </g>

  <!-- Outer Border Rim -->
  <circle cx="512" cy="512" r="508" fill="none" stroke="url(#circRimGrad)" stroke-width="8" stroke-opacity="0.8" />
</svg>
